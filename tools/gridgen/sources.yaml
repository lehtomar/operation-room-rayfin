# =============================================================================
# UNITED KINGDOM — operator portals, not the topographic DB
# =============================================================================
# Regulatory driver: Ofgem Data Best Practice Guidance v3.5 (2025-11-17) is a
# LICENCE CONDITION. The sector operates on a 'presumed open' principle.
# Expect several adapters, not one.
# =============================================================================

  GB:
    name: United Kingdom
    group: 2
    crs: "EPSG:27700"

    topographic:
      OS_Open_Zoomstack:
        status: ready
        agency: Ordnance Survey
        access:
          type: [bulk, api]
          endpoint: "https://osdatahub.os.uk"
          auth: api_key           # OpenData Plan — free
        formats: [gpkg, vector_tiles]
        licence:
          name: OS OpenData
          tier: permissive
        update_cadence: "2/year"
        features:
          line: [ETL]             # Electricity Transmission Lines
        limitations:
          - "Generalised cartographic basemap — no pylons, no voltage"

      OS_MasterMap_Topography:
        status: blocked
        agency: Ordnance Survey
        licence:
          name: OS Premium / PSGA
          tier: restricted
        features:
          tower: ["Pylon (individual features)"]
        blockers:
          - "Premium licence; PSGA access is granted to member organisations, not to products"

      OS_NGD_Structures:
        status: verify
        agency: Ordnance Survey
        access:
          type: ogc_api_features
          endpoint: "https://api.os.uk/features/ngd/ofa/v1"
          auth: api_key
        licence:
          tier: restricted
        blockers:
          - "Documented scope omits pylons — verify Structure Point description code list"

    operators:
      UKPN:
        status: verify
        name: UK Power Networks
        regions: [EPN, LPN, SPN]
        access:
          type: opendatasoft_v2.1
          endpoint: "https://ukpowernetworks.opendatasoft.com"
          auth: api_key           # env: UKPN_API_KEY
          client: ukpyn           # official Python client
        formats: [geojson, shp, csv, json]
        native_geojson: true
        provenance: "Extracted from NetMap — operator-authoritative asset data"
        licence:
          name: "UKPN Open Data Licence"
          tier: permissive
          verified: false
        features:
          line:
            - hv_overhead_lines   # 11 kV
            - lv_overhead_lines   # 400 V
          pole:
            - hv_poles
            - lv_poles
          substation:
            - primary_substations
            - secondary_sites
        blockers:
          - "BLOCKING: retrieve the exact licence instrument (CC BY 4.0? OGL? bespoke?)"

      NGED:
        status: ready
        name: National Grid Electricity Distribution
        access:
          type: ckan
          endpoint: "https://connecteddata.nationalgrid.co.uk"
          auth: api_token         # required since 2024-06-01
        formats: [shp, dwg, dgn, gpkg]
        features:
          line: ["11kV Overhead Lines", "132kV Overhead Lines"]
          boundary: ["GSP", "BSP", "Primary supply areas"]
        warning: "DISTINCT from National Grid Electricity Transmission (NGET) — do not conflate"

      SPEN:
        status: verify
        name: SP Energy Networks
        access:
          type: opendatasoft
          endpoint: "https://spenergynetworks.opendatasoft.com"
        scope: [distribution, transmission]   # SPEN is also a TO in Scotland
        licence:
          name: "Open Data Licence + Shared Data Licence"
          tier: permissive
        blockers:
          - "Confirm conductor line geometry (not just substation points)"

      ENWL:
        status: verify
        name: Electricity North West
        access:
          type: opendatasoft
          endpoint: "https://electricitynorthwest.opendatasoft.com"
        blockers:
          - "Confirm conductor line geometry is downloadable"

      NPg:
        status: verify
        name: Northern Powergrid
        access:
          type: opendatasoft
          endpoint: "https://northernpowergrid.opendatasoft.com"
        features:
          substation: [ltds_ehv_sites]    # updated May/Nov
        blockers:
          - "Confirm conductor line geometry is downloadable"

      SSEN:
        status: verify
        name: Scottish and Southern Electricity Networks
        regions: [SEPD, SHEPD]
        access:
          type: portal
          endpoint: "https://data.ssen.co.uk"
          auth: account
        features:
          substation: ["SSEN Substation Data"]
        blockers:
          - "Full network GIS is Electric Office — login-gated, ~2 working days approval"

      NIE:
        status: ready
        name: NIE Networks
        region: Northern Ireland
        scope: [transmission, distribution]
        access:
          type: opendatasoft
          endpoint: "https://nienetworks.opendatasoft.com"
        licence:
          name: OGL v3.0
          tier: permissive
        crs: "EPSG:2157"          # Irish Grid / ITM — NOT OS GB
        notes: "Separate pipeline branch — OSNI, not OS"

      NGET:
        status: blocked
        name: National Grid Electricity Transmission
        access:
          endpoint: "nationalgrid.com/electricity-transmission/network-and-infrastructure/network-route-maps"
        formats: [shp]
        features:
          line: ["Over Head Line", "Cables"]
          tower: [Towers]
          substation: [Substation, Site]
        licence:
          tier: restricted
        blockers:
          - >-
            LICENCE TRAP: 'can only be used for emergency and land use planning
            and cannot be used for commercial purposes'. Check the terms against
            your intended use before ingesting.

    aggregation:
      NESO_GSP:
        status: ready
        name: "GIS Boundaries for GB Grid Supply Points"
        access:
          type: ckan
          endpoint: "https://api.neso.energy"
        formats: [shp, geojson]
        crs: "EPSG:27700"
        licence:
          name: NESO Open Data Licence
          tier: permissive
        scope: boundary_only      # Thiessen-derived regions, NOT network geometry
        notes: "GSP IDs registered with Elexon — joins DNO data to settlement data"

