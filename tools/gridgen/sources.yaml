# =============================================================================
# PAN-REGIONAL FALLBACK — OpenStreetMap
# =============================================================================
# MUST load into the osm_derived layer. See grid-data-sources.md, section
# "ODbL and data architecture".
# =============================================================================

osm:
  status: ready
  licence:
    name: ODbL 1.0
    tier: share_alike
    attribution: "© OpenStreetMap contributors"
    architecture_rule: >-
      Never write non-OSM attributes onto an OSM feature record. Never persist
      merged OSM + non-OSM geometry into a distributed database. Join at render
      time (Produced Work, §4.3) or keep co-located but unmerged (Collective
      Database, §4.5a).
  legal_review_required: true

  crs: "EPSG:4326"

  tags:
    line: [power=line, power=minor_line, power=cable]
    tower: [power=tower]
    pole: [power=pole]
    substation: [power=substation]
    plant: [power=generator, power=plant]

  attributes:
    voltage: "volts; semicolon-separated for multi-circuit"
    circuits: integer
    cables: integer
    frequency: "0 = HVDC, 16.7 = traction (filter out)"
    operator: string
    ref: "line designation"
    location: "overhead | underground | underwater"

  known_gaps:
    untagged_voltage_pct: 15.1    # OpenInfraMap global
    topology: "Lines terminate at towers, not substation busbars — infer incidence by spatial join"

  coverage_ranking: [EU, GB, CA]   # best to worst

  tooling:
    bulk: geofabrik                # daily per-country .osm.pbf — correct ingest path
    query: overpass                # dev/small AOI only, rate-limited
    quality: [ohsome, osmose]      # completeness scoring + power-topic QA
    processing: [osmium, osm2pgsql, pyrosm]
    visual_check: "https://openinframap.org"

  derived_datasets:
