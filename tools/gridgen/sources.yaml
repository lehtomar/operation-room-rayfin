          - name: "Lignes de transport électrique"
            agency: Ville de Montréal
            status: ready
            extent: municipal      # Montreal only
            formats: [gpkg, shp]
            crs: NAD83(CSRS)
            accuracy_m: 0.4
            licence: { name: CC BY 4.0, tier: permissive }
