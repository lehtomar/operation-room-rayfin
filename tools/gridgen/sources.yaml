    LV: { dataset: Topo50, agency: LGIA }
    LU: { dataset: BD-L-TC, agency: ACT, note: "Small, open, CC BY — good testbed" }
    HR: { dataset: "TTB / CROTIS", agency: DGU, note: "Partially open" }
    IS: { dataset: IS 50V, note: "Fully open CC BY; has infrastructure layer" }
