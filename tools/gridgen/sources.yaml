# =============================================================================
# Grid data source registry
# =============================================================================
# Machine-readable index of national topographic and network-operator sources
# that could feed the gridgen pipeline outside Finland.
#
# Companion document: grid-data-sources.md
# Compiled: 2026-07-27
#
# Research notes, not a specification. Entries marked `status: verify` were not
# confirmed against a live service. Licence fields summarise published terms and
# are not legal advice — read the actual licence for your intended use.
#
# -----------------------------------------------------------------------------
# SCHEMA
# -----------------------------------------------------------------------------
# status            ready    — content and licence confirmed
#                   verify   — content or licence unconfirmed; see `blockers`
#                   blocked  — known licence or access barrier
#
# licence.tier      permissive   — CC BY / CC0 / OGL / Etalab. Free to combine.
#                   share_alike  — ODbL. Must be kept in an isolated layer.
#                   restricted   — gated, or terms that narrow permitted use.
#
#                   `tier` drives the Collective Database separation described
#                   in grid-data-sources.md, section "ODbL and data
#                   architecture". A loader must refuse to write share_alike
#                   features into a permissive layer.
#
# features.*        Native source class names, verbatim. `null` means the class
#                   list is UNVERIFIED — resolve it rather than guessing.
#                   Mapped to the canonical model below.
#
# CANONICAL TARGET MODEL (aligned to INSPIRE Utility Networks where practical)
#   line            conductor centreline              LineString
#   tower           HV pylon                          Point
#   pole            distribution pole                 Point
#   substation      substation / transformer station  Point | Polygon
#   plant           generation site                   Point | Polygon
# =============================================================================

version: 1

defaults:
  target_crs: "EPSG:4326"
  target_format: geojson
  # Attribution is unconditional for any share_alike source.
  attribution_required: true

# =============================================================================
# LAYER SEPARATION — enforces the ODbL Collective Database boundary
# =============================================================================
layers:
  permissive:
    description: >-
      Openly licensed source data and anything derived from it. Never merge
      share_alike features in; never persist a joined geometry here.
    accepts_tiers: [permissive]

  osm_derived:
    description: >-
      ODbL-encumbered content, including anything INFERRED from OSM (voltage
      estimation, topology reconstruction). Physically separate tables, full
      provenance tagging, isolated at rest.
    accepts_tiers: [share_alike]
    attribution: "© OpenStreetMap contributors, ODbL"

# =============================================================================
# EU / EEA — national topographic databases
# =============================================================================
countries:

  # ----------------------------------------------------------------- GROUP 1 --
  NL:
    name: Netherlands
    status: ready
    group: 1
    dataset: TOP10NL
    agency: Kadaster / PDOK
    access:
      type: ogc_api_features
      endpoint: "https://api.pdok.nl/kadaster/brt-top10nl/ogc/v1/"
      auth: none
    formats: [geojson, json-fg, gpkg, gml]
    native_geojson: true          # only source in the registry — skip conversion
    crs: "EPSG:28992"
    licence:
      name: CC BY 4.0
      tier: permissive
    update_cadence: "5 releases/year (Feb, Apr, Jun, Sep, Nov)"
    features:
      line: [hoogspanningsleiding]
      tower: [hoogspanningsmast]
      substation: [transformatorstation]
      plant: [elektriciteitscentrale, kerncentrale]

  FR:
    name: France
    status: ready
    group: 1
    dataset: BD TOPO v3
    agency: IGN / Géoplateforme
    access:
      type: [bulk, wfs]
      endpoint: "https://data.geopf.fr"
      auth: none
    formats: [shp, gpkg]
    geometry_3d: true
    crs: "EPSG:2154"              # mainland; overseas départements use per-territory UTM
    licence:
      name: Licence Ouverte / Etalab 2.0
      tier: permissive
    update_cadence: quarterly
    features:
      line: [LIGNE_ELECTRIQUE]
      tower: [PYLONE]
      substation: [POSTE_DE_TRANSFORMATION]
    notes: >-
      RTE withdrew precise pylon coordinates in 2024 on public-security
      grounds. BD TOPO PYLONE remains the open pylon source.

  CZ:
    name: Czechia
    status: verify
    group: 1
    dataset: ZABAGED
    agency: ČÚZK
    access:
      type: [bulk, wfs, atom]
      endpoint: "https://geoportal.cuzk.gov.cz"
      auth: none
    formats: [shp, dgn, gml]
    crs: "EPSG:5514"
    licence:
      name: ČÚZK open data
      tier: permissive
      verified: false             # licence text not read
    features:
      line: ["ELEKTRICKÉ VEDENÍ"]
      tower: ["STOŽÁR ELEKTRICKÉHO VEDENÍ"]
      substation: ["ROZVODNA, TRANSFORMOVNA"]
      plant: ["ELEKTRÁRNA"]
    blockers:
      - "Confirm open-data licence text before use"
    notes: >-
      Catalogue category 3 'Rozvodné sítě a produktovody', current to
      2026-01-01. Above-ground parts only.

  DK:
    name: Denmark
    status: ready
    group: 1
    dataset: GeoDanmark
    agency: Klimadatastyrelsen / Datafordeler
    access:
      type: [wfs, bulk, change_feed]
      endpoint: "https://datafordeler.dk"
      auth: account               # free registration + service-user credentials
      change_feed: "GeoDanmark Vektor Hændelser"
    formats: [gml, shp, tab]
    geometry_3d: true
    crs: "EPSG:25832"
    licence:
      name: Danish public basic data
      tier: permissive
    features:
      line: ["Højspændingsledning"]
      tower: [Mast]
    notes: >-
      Only source with a clean incremental-update mechanism. Prefer the
      change feed over a full re-ingest.

  # ----------------------------------------------------------------- GROUP 2 --
  DE:
    name: Germany
    status: verify
    group: 2
    dataset: ATKIS Basis-DLM
    agency: AdV / Landesvermessungsverwaltungen
    access:
      type: bulk
      endpoint: "https://basemap.de/open-data/"
      auth: none
      note: "One GeoPackage per Bundesland — avoids 16 separate portals"
    formats: [gpkg, nas, shp]
    crs: "EPSG:4326"              # basemap.de reprojects; raw ATKIS is 25832/25833
    licence:
      name: DL-DE/Zero-2.0 or DL-DE/BY-2.0
      tier: permissive
    update_cadence: weekly
    features:
      line: [AX_Leitung]          # UNVERIFIED: BWF value codes not confirmed
      tower: [AX_Turm]
      substation: null
    blockers:
      - "Confirm power features survive the basemap.de model transformation"
      - "Verify AX_Leitung BWF/Bauwerksfunktion codes for Freileitung"
    fallback:
      description: "Per-state raw Basis-DLM if basemap.de drops power features"
      example: "https://opengeodata.nrw.de"
    notes: >-
      BKG's nationwide Basis-DLM (Ebenen / kompakt) is a paid product needing a
      signed licence agreement; its free DLM250/DLM1000 are too coarse.

  PL:
    name: Poland
    status: ready
    group: 2
    dataset: BDOT10k
    agency: GUGiK
    access:
      type: bulk
      endpoint: "https://opendata.geoportal.gov.pl"
      auth: none
      granularity: powiat
    formats: [gml]                # GML 3.2 only
    crs: "EPSG:2180"
    licence:
      name: GUGiK open data
      tier: permissive
    features:
      line:
        SULN01: EHV               # najwyższego napięcia — 220/400 kV
        SULN02: HV                # wysokiego napięcia — 110 kV
        SULN03: MV                # średniego napięcia
        SULN04: LV                # niskiego napięcia
      substation: ["podstacja elektroenergetyczna"]
    notes: >-
      Four-level voltage classification is richer than Finland's.
      GML-only parsing is the main integration cost.

  # ----------------------------------------------------------------- GROUP 3 --
  ES:
    name: Spain
    status: verify
    group: 3
    dataset: BTN
    agency: IGN / CNIG
    access:
      type: [bulk, atom, wmts]
      endpoint: "https://centrodedescargas.cnig.es/CentroDescargas/btn"
      auth: none
    formats: [gpkg, shp, dwg]
    crs: ["ETRS89 UTM", "REGCAN95 UTM"]   # dual datum — Canaries differ
    licence:
      name: Orden FOM/2807/2015 (CC BY 4.0 compatible)
      tier: permissive
      attribution: "BTN CC-BY 4.0 scne.es"
    features:
      theme: Energia               # theme confirmed; classes NOT enumerated
      line: null
      tower: null
      substation: null
    blockers:
      - "Enumerate 'Energia' theme feature classes — spec ESPBTN.pdf from p.15"

  SE:
    name: Sweden
    status: verify
    group: 3
    dataset: Topografi 10
    agency: Lantmäteriet
    access:
      type: api
      endpoint: "https://geotorget.lantmateriet.se"
      auth: account               # per-product entitlement
    formats: [shp, gpkg]
    crs: "EPSG:3006"
    licence:
      name: CC0
      tier: permissive
      verified: false
    update_cadence: "12/year"
    features:
      line: ["Kraftledning stam", "Kraftledning region"]
      substation: ["Transformatorområde"]
      tower: null                 # no pylon point class found
    blockers:
      - "Confirm Topografi 10 is on Lantmäteriet's CC0 open-data list"

  "NO":
    name: Norway
    status: ready
    group: 3
    dataset: N50 Kartdata
    agency: Kartverket / Geonorge
    access:
      type: bulk
      endpoint: "https://kartkatalog.geonorge.no"
      auth: none
    formats: [sosi, fgdb, gml, postgis]
    crs: "EPSG:25833"
    licence:
      name: CC BY 4.0
      tier: permissive
    update_cadence: weekly
    accuracy_m: [2, 50]           # 1:50k generalisation — may be too coarse
    features:
      line: ["Kraftlinje", "Kraftspenn"]
      tower: [Mast, "Tårn"]
    notes: >-
      Detailed FKB (incl. FKB-Ledning) is NOT open — purchase via Geovekst.
      NVE publishes Norwegian grid infrastructure openly as a complement.

  AT:
    name: Austria
    status: ready
    group: 3
    dataset: BEV Digitales Landschaftsmodell (BAUTEN)
    agency: BEV
    access:
      type: bulk                  # no API exists
      endpoint: "https://data.bev.gv.at"
      auth: none
    formats: [gpkg, shp]
    crs: "EPSG:31255"
    licence:
      name: CC BY 4.0
      tier: permissive
    update_cadence: "annual to 3-yearly"
    accuracy_m: 3
    features:
      line: [Stromleitung]
      tower: [Strommast]

  BE:
    name: Belgium
    status: ready
    group: 3
    dataset: Top10Vector
    agency: NGI / IGN
    access:
      type: [bulk, wms]
      endpoint: "https://www.geo.be"
      auth: none
    formats: [gpkg, shp]
    geometry_3d: true
    crs: "EPSG:3812"
    licence:
      name: CC BY 4.0
      tier: permissive
    update_cadence: "6 years"     # non-road themes — power sits here
    features:
      theme: "High-voltage network"
    notes: >-
      NGI charges per file for custom reprojection or reformatting. Take the
      standard Lambert 2008 GeoPackage and reproject in-pipeline.

  EE:
    name: Estonia
    status: verify
    group: 3
    dataset: ETAK
    agency: Maa- ja Ruumiamet
    access:
      type: [bulk, wms, wfs]
      endpoint: "https://geoportaal.maaruum.ee"
      auth: none
    formats: [gpkg, shp, fgdb, tab, dgn, dwg]
    crs: "EPSG:3301"
    licence:
      name: Estonian Open Data Licence
      tier: permissive
      attribution: "Map data by Republic of Estonia Land and Spatial Development Board"
    update_cadence: weekly        # best cadence in the registry
    features:
      theme: "Tehnovõrgud"
      line: null
      tower: null
    blockers:
